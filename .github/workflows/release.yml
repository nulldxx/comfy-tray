name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  build-and-release:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            echo "VERSION=${{ github.event.inputs.version }}" >> $env:GITHUB_OUTPUT
          } else {
            $version = "${{ github.ref_name }}"
            echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          }
          $numericVersion = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ github.event.inputs.version }}" } else { "${{ github.ref_name }}" }
          $numericVersion = $numericVersion -replace '^v', ''
          echo "NUMERIC_VERSION=$numericVersion" >> $env:GITHUB_OUTPUT
          echo "Version: $numericVersion"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup WiX Toolset
        run: |
          Write-Host "Installing WiX Toolset..."
          choco install wixtoolset -y --no-progress
          Write-Host "Refreshing environment..."
          refreshenv
          # Add WiX to PATH for this session
          $env:PATH += ";C:\Program Files (x86)\WiX Toolset v3.11\bin"
          echo "PATH=$env:PATH" >> $env:GITHUB_ENV

      - name: Update WiX Product Version
        run: |
          $version = "${{ steps.version.outputs.NUMERIC_VERSION }}"
          $wxsPath = "Version.wxi"

          Write-Host "Updating Version.wxi with version: $version"

          $content = Get-Content $wxsPath -Raw
          $content = $content -replace '(?<=<\?define ProductVersion=")[\d\.]*(?=" \?>)', $version

          Set-Content $wxsPath -Value $content -NoNewline

          Write-Host "Version.wxi updated"
          Get-Content $wxsPath | Select-String "define ProductVersion"

      - name: Restore dependencies
        run: dotnet restore ComfyTray.csproj

      - name: Build application
        run: dotnet build ComfyTray.csproj -c Release --no-restore -p:Version=${{ steps.version.outputs.NUMERIC_VERSION }}

      - name: Build guard service
        run: |
          dotnet restore ComfyTrayGuard/ComfyTrayGuard.csproj
          dotnet build ComfyTrayGuard/ComfyTrayGuard.csproj -c Release --no-restore -p:Version=${{ steps.version.outputs.NUMERIC_VERSION }}

      - name: Run tests
        run: dotnet test ComfyTray.Tests/ComfyTray.Tests.csproj -c Release --logger "console;verbosity=normal"

      - name: Publish application
        run: dotnet publish ComfyTray.csproj -c Release -o bin/Release/net10.0-windows/publish --no-build -p:Version=${{ steps.version.outputs.NUMERIC_VERSION }}

      - name: Build WiX Installer
        run: |
          $env:PATH += ";C:\Program Files (x86)\WiX Toolset v3.11\bin"
          Write-Host "Building WiX installer..."
          msbuild ComfyTray.Installer/ComfyTray.Installer.wixproj /p:Configuration=Release /p:Platform=x64 /v:normal
          if ($LASTEXITCODE -ne 0) {
            Write-Host "WiX build failed with exit code: $LASTEXITCODE"
            exit $LASTEXITCODE
          }
          Write-Host "WiX build completed"

      - name: Build WiX Bundle
        run: |
          $env:PATH += ";C:\Program Files (x86)\WiX Toolset v3.11\bin"
          Write-Host "Building the guard MSI and the bundle..."
          # The bundle project references both installers, so this builds the guard MSI too.
          msbuild ComfyTray.Bundle/ComfyTray.Bundle.wixproj /p:Configuration=Release /p:Platform=x64 /v:normal
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Bundle build failed with exit code: $LASTEXITCODE"
            exit $LASTEXITCODE
          }
          Write-Host "Bundle build completed"

      - name: Verify and rename MSI file
        run: |
          $version = "${{ steps.version.outputs.NUMERIC_VERSION }}"

          Write-Host "Looking for MSI files..."
          Get-ChildItem ComfyTray.Installer -Recurse -ErrorAction SilentlyContinue | Where-Object {$_.Extension -eq ".msi"} | Format-Table FullName, Length

          $originalPath = "ComfyTray.Installer/bin/x64/Release/ComfyTraySetup.msi"
          $newFileName = "ComfyTraySetup-v$version-x64.msi"

          if (Test-Path $originalPath) {
            Write-Host "MSI file found: $originalPath"
            $size = (Get-Item $originalPath).Length
            Write-Host "MSI size: $([math]::Round($size / 1MB, 2)) MB"

            Copy-Item -Path $originalPath -Destination $newFileName
            Write-Host "MSI copied as: $newFileName"
          } else {
            Write-Host "MSI file not found: $originalPath"
            exit 1
          }

          # The bundle is the full install: the tray plus the firewall guard service. The MSI
          # above stays published as the tray-only, no-elevation route.
          $bundlePath = "ComfyTray.Bundle/bin/x64/Release/ComfyTrayBundle.exe"
          $bundleName = "ComfyTraySetup-v$version-x64.exe"

          if (Test-Path $bundlePath) {
            Copy-Item -Path $bundlePath -Destination $bundleName
            Write-Host "Bundle copied as: $bundleName"
          } else {
            Write-Host "Bundle not found: $bundlePath"
            exit 1
          }

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $numericVersion = "${{ steps.version.outputs.NUMERIC_VERSION }}"

          $releaseNotes = @"
          ## Downloads

          ### Windows Installer
          - **ComfyTraySetup-v$numericVersion-x64.exe** - full install: the tray plus the ComfyTray Guard service
          - **ComfyTraySetup-v$numericVersion-x64.msi** - the tray on its own, per-user, no administrator rights needed

          ## Which one
          The **.exe** installs the tray per-user and adds the ComfyTray Guard service per-machine,
          so it asks for administrator rights once. The guard is what turns outbound blocking from
          best effort into real Windows Firewall rules covering the whole ComfyUI process tree, and
          it removes every rule it created when ComfyUI stops. To skip it, run
          ``ComfyTraySetup-v$numericVersion-x64.exe InstallGuard=0``.

          The **.msi** is the tray alone, exactly as it has always shipped: per-user, no elevation,
          with best-effort environment-variable isolation only.

          ## Installation
          1. Download one of the installers above
          2. Run it
          3. The tray installs per-user to %LocalAppData%\Programs\ComfyTray
          4. Desktop and Start Menu shortcuts will be created

          ## If firewall rules are ever left behind
          The guard removes its rules when ComfyUI stops, when the tray exits, and when the service
          starts or stops. If a crash ever strands one, clear them from an elevated prompt:
          ``netsh advfirewall firewall delete rule group="ComfyTrayGuard"``

          ## System Requirements
          - **OS**: Windows 10 or later (64-bit)
          - **.NET Runtime**: .NET 10.0 Runtime (Desktop) - [Download here](https://dotnet.microsoft.com/download/dotnet/10.0)
          "@

          Set-Content -Path "release_notes.md" -Value $releaseNotes

          if (gh release view "$version" 2>$null) {
            Write-Host "Release $version already exists"
          } else {
            gh release create "$version" --title "ComfyUI Tray $version" --notes-file "release_notes.md" --latest
          }

      - name: Upload MSI Installer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $numericVersion = "${{ steps.version.outputs.NUMERIC_VERSION }}"

          $msiFile = "ComfyTraySetup-v$numericVersion-x64.msi"
          $bundleFile = "ComfyTraySetup-v$numericVersion-x64.exe"
          Write-Host "Uploading installers to release..."
          gh release upload $version $msiFile $bundleFile --clobber
          Write-Host "Installers uploaded successfully"
